{% extends 'base.html' %}
{% load static %}

{% block title %}Shopping Bag | LINO Fragrance of Heaven{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
  <h1 class="text-3xl sm:text-4xl font-serif font-bold text-neutral-900 mb-8 pb-4 border-b border-neutral-200">
    Your Shopping Bag
  </h1>
  <div id="cart-empty-state" class="text-center py-16 bg-neutral-50 rounded-2xl border border-neutral-200/80">
    <svg class="w-16 h-16 text-neutral-400 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2" d="M15.75 10.5V6a3.75 3.75 0 10-7.5 0v4.5m11.356-1.993l1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 01-1.12-1.243l1.264-12A1.125 1.125 0 015.513 7.5h12.974c.576 0 1.059.435 1.119 1.007zM8.625 10.5a.375.375 0 11-.75 0 .375.375 0 01.75 0zm7.5 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
    </svg>
    <h2 class="text-xl font-serif font-semibold text-neutral-800 mb-2">Your fragrance bag is empty</h2>
    <p class="text-neutral-500 text-sm mb-6">Discover our curated perfumes to find your signature scent.</p>
    <a href="{% url 'home' %}#new-arrivals" class="inline-block bg-black hover:bg-neutral-800 text-white text-xs font-bold uppercase tracking-wider py-3.5 px-8 rounded-full transition shadow-md">
      Shop Best Sellers
    </a>
  </div>
</div>
{% endblock %}
