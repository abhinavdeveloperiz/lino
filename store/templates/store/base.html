{% load static %}
<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}LINO | Fragrance of Heaven{% endblock %}</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="{% static 'image/logo.png' %}">

  <!-- Google Fonts: Playfair Display, Cinzel, Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            serif: ['"Playfair Display"', 'Georgia', 'serif'],
            cinzel: ['"Cinzel"', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            lino: {
              gold: '#D4AF37',
              dark: '#0A0A0A',
            }
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0', transform: 'translateY(-6px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            toastIn: {
              '0%': { opacity: '0', transform: 'translateY(20px) scale(0.95)' },
              '100%': { opacity: '1', transform: 'translateY(0) scale(1)' },
            }
          },
          animation: {
            fadeIn: 'fadeIn 0.25s ease-out forwards',
            toastIn: 'toastIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards',
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #FFFFFF;
      color: #1A1A1A;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    
    .font-cinzel {
      font-family: 'Cinzel', serif;
    }

    .font-serif {
      font-family: 'Playfair Display', Georgia, serif;
    }

    /* Custom luxury scrollbar */
    ::-webkit-scrollbar {
      width: 7px;
    }
    ::-webkit-scrollbar-track {
      background: #000000;
    }
    ::-webkit-scrollbar-thumb {
      background: #333333;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #555555;
    }
  </style>

  {% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen flex flex-col bg-white text-neutral-900 selection:bg-black selection:text-white">

  <!-- Navbar Component -->
  {% include 'components/navbar.html' %}

  <!-- Main Dynamic Page Content -->
  <main class="flex-grow">
    {% block content %}
    {% endblock %}
  </main>

  <!-- Footer Component -->
  {% include 'components/footer.html' %}

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col space-y-3 pointer-events-none"></div>

  <!-- Shared Global Cart Scripts -->
  <script>
    let cartCount = parseInt(localStorage.getItem('lino_cart_count') || '0');

    function updateNavBadge() {
      const badge = document.getElementById('nav-cart-badge');
      if (badge) {
        badge.textContent = cartCount;
      }
    }

    function showToast(message) {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = `pointer-events-auto flex items-center space-x-3 bg-neutral-950 text-white px-5 py-3.5 rounded-xl shadow-2xl border border-neutral-800 animate-toastIn text-sm`;
      
      const icon = `<svg class="w-5 h-5 text-emerald-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>`;

      toast.innerHTML = `${icon}<span>${message}</span>`;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(10px)';
        toast.style.transition = 'all 0.3s ease';
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    function addToCart(productName, price) {
      cartCount++;
      localStorage.setItem('lino_cart_count', cartCount);
      updateNavBadge();
      showToast(`Added <strong>${productName}</strong> to your bag!`);
    }

    document.addEventListener('DOMContentLoaded', () => {
      updateNavBadge();
    });
  </script>

  {% block extra_scripts %}{% endblock %}
</body>
</html>
